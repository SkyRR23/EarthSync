[package]
name = "field_shift_engine"
version = "0.1.0"
edition = "2024"
description = "Field Shift on-device environmental analysis foundation"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
