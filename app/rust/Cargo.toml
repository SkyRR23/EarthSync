[package]
name = "field_shift_bridge"
version = "0.1.0"
edition = "2021"
description = "flutter_rust_bridge wrapper over the team's field_shift_engine (engine/). No analysis logic lives here."

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
field_shift_engine = { path = "../../engine" }
flutter_rust_bridge = "=2.13.0"
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
