[project]
name = "earthsync-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.121.3", "httpx==0.28.1", "uvicorn==0.38.0"]

[project.optional-dependencies]
evidence = ["pillow==12.2.0"]
test = ["pytest==9.0.1", "pytest-asyncio==1.3.0", "ruff==0.14.5"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["earthsync*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.package-data]
"earthsync.assistant" = ["locales/*.json"]
