[project]
name = "earthsync-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.121.3", "httpx==0.28.1", "uvicorn==0.38.0"]

[project.optional-dependencies]
test = ["pytest==9.0.1", "pytest-asyncio==1.3.0", "ruff==0.14.5"]
# Optional soil-photo AI provider (not chosen yet).
claude = ["anthropic==2.8.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["earthsync*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
