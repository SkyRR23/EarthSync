name: Crop and water intelligence
on:
  pull_request:
    paths:
      - 'engine/**'
      - 'server/**'
      - 'data/crop-knowledge/v2/**'
      - '.github/workflows/crop-water-advisor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-science:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: python -m pip install -r server/requirements.lock
      - run: cargo build --locked --manifest-path engine/Cargo.toml --example v03_demo
      - run: cargo test --locked --manifest-path engine/Cargo.toml
      - run: PYTHONPATH=server EARTHSYNC_TEST_V03="$PWD/engine/target/debug/examples/v03_demo" python -m pytest server/tests/platform_v1/test_water_intelligence.py server/tests/assistant -q
      - run: python data/crop-knowledge/v2/tools/build.py --check
      - run: python data/crop-knowledge/v2/tools/knowledge.py check
      - run: python -m unittest discover -s data/crop-knowledge/v2/tests -p test_scientific.py -v
      - run: python -m ruff check server/earthsync/platform_v1 server/earthsync/assistant server/tests/platform_v1/test_water_intelligence.py
      - run: git diff --check
      # Live NASA and browser acceptance are explicit local/opt-in checks.
