name: Flutter live integration

on:
  push:
    branches: [feat/flutter-live-nasa-integration]
  pull_request:
    paths: ["app/**", "engine/**", ".github/workflows/flutter-live-integration.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-flutter-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: Inspect Flutter toolchain
        run: flutter doctor -v
      - name: Build actual native Rust bridge for host tests
        run: cargo build --release --locked --manifest-path app/rust/Cargo.toml
      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Format changed Dart files
        run: |
          mapfile -t changed_dart < <(git diff --name-only origin/feature/flutter-app...HEAD -- '*.dart')
          if [ "${#changed_dart[@]}" -gt 0 ]; then
            dart format "${changed_dart[@]}"
          fi
          git diff --binary > flutter-tooling.patch
      - name: Analyze Flutter
        working-directory: app
        # Flutter 3.50 deprecates the existing Material import shim. Keep these
        # informational migration notices visible without changing the app UI stack.
        run: flutter analyze --no-fatal-infos
      - name: Flutter widget, adapter and real native bridge tests (offline)
        working-directory: app
        run: flutter test
      - uses: actions/setup-python@v5
        if: github.event_name == 'push'
        with:
          python-version: '3.12'
      - name: Check out reviewed Python backend separately
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: 4befe7d1e204c875436ab486c231edcbb944f317
          path: backend-review
      - name: Live NASA -> Python -> Flutter -> Rust -> Flutter smoke
        if: github.event_name == 'push'
        run: |
          python -m pip install -r backend-review/server/requirements.lock
          PYTHONPATH="$PWD/backend-review/server" python -m uvicorn earthsync.api:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/earthsync-backend.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid"' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then break; fi
            sleep 1
          done
          cd app
          flutter test test/native_bridge_test.dart --dart-define=RUN_LIVE_NASA=true --dart-define=BACKEND_URL=http://127.0.0.1:8000
      - name: Save Flutter tooling changes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-tooling
          path: |
            flutter-tooling.patch
            app/pubspec.lock
