name: Flutter live integration

on:
  pull_request:
    paths: ["app/**", "engine/**", "ops/staging/**", "scripts/ci_staging_startup.py", ".github/workflows/flutter-live-integration.yml"]
  push:
    branches: [feat/flutter-live-nasa-integration, feat/web-demo]
  workflow_dispatch:
    inputs:
      live_nasa:
        description: Run the optional live NASA smoke test (requires upstream availability)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-staging:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Build actual Windows 7Q runtimes with private ACLs
        shell: pwsh
        run: |
          $private = Join-Path $env:RUNNER_TEMP 'earthsync-7x-private'
          New-Item -ItemType Directory -Path $private | Out-Null
          & ./ops/staging/staging.ps1 -State (Join-Path $private 'platform') build --profile platform --source $env:GITHUB_WORKSPACE --sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./ops/staging/staging.ps1 -State (Join-Path $private 'web') build --profile web --source $env:GITHUB_WORKSPACE --sha $env:GITHUB_SHA --flutter-version 3.44.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci_staging_startup.py --source $env:GITHUB_WORKSPACE --private $private
          exit $LASTEXITCODE
  verify-flutter-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Inspect Flutter toolchain
        run: flutter doctor -v
      - name: Build actual native Rust bridge for host tests
        run: cargo build --release --locked --manifest-path app/rust/Cargo.toml
      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Check repository Dart formatting without changing sources
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_support example
      - name: Analyze Flutter
        working-directory: app
        run: flutter analyze
      - name: Flutter widget, adapter and real native bridge tests (offline)
        working-directory: app
        timeout-minutes: 4
        run: flutter test --reporter expanded
      - name: Build browser demo
        working-directory: app
        run: flutter build web --no-web-resources-cdn --pwa-strategy=none --no-wasm-dry-run
      - name: Prepare public offline shell
        run: python scripts/finalize_offline.py app/build/web
      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' && inputs.live_nasa
        with:
          python-version: '3.12'
      - name: Live NASA through the unified backend and both Flutter execution paths
        if: github.event_name == 'workflow_dispatch' && inputs.live_nasa
        run: |
          python -m pip install -r server/requirements.lock
          cargo build --locked --manifest-path engine/Cargo.toml --example web_engine
          PYTHONPATH="$PWD/server" python -m uvicorn earthsync.web_demo:app --host 127.0.0.1 --port 8000 --no-access-log > "$RUNNER_TEMP/earthsync-backend.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid"' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then break; fi
            sleep 1
          done
          cd app
          flutter test test/native_bridge_test.dart test/web_engine_test.dart --dart-define=RUN_LIVE_NASA=true --dart-define=RUN_WEB_DEMO=true --dart-define=BACKEND_URL=http://127.0.0.1:8000 --dart-define=WEB_DEMO_URL=http://127.0.0.1:8000/ --reporter expanded
      - name: Preserve tested Flutter dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-dependency-lock
          path: app/pubspec.lock
