name: Compile Android source (no APK)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Compile Dart and assets without producing an APK or running tests
        working-directory: app
        run: flutter build bundle --release --target-platform android-arm64 --dart-define-from-file=config/cloud.json --dart-define=SOURCE_SHA=$GITHUB_SHA
