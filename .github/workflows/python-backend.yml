name: Python backend CI

on:
  pull_request:
    paths: ["server/**", "engine/**", ".github/workflows/python-backend.yml"]
  push:
    branches: [main, feat/nasa-power-backend]
    paths: ["server/**", "engine/**", ".github/workflows/python-backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Install tested Python dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Cache Rust dependencies for offline contract tests
        run: cargo fetch --locked --manifest-path ../engine/Cargo.toml
      - name: Ruff
        run: |
          python -m ruff check earthsync tests
          python -m ruff format --check earthsync tests
      - name: Offline backend and Rust JSON compatibility tests
        run: python -m pytest -q
      - name: Patch integrity
        run: git diff --check
