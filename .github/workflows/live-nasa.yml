name: Authenticated NASA raster smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-nasa:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements.lock
      - name: Read actual NASA native pixels and numeric products
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          PYTHONPATH: server
        run: python scripts/live_nasa_smoke.py --numeric --output '${{ runner.temp }}/nasa-derived-receipt.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nasa-derived-public-receipt
          path: ${{ runner.temp }}/nasa-derived-receipt.json
          if-no-files-found: warn
