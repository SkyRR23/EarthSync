name: Crop evidence v2 reference contracts

on:
  pull_request:
    paths:
      - "data/crop-knowledge/v2/**"
      - "docs/integration/7p/**"
      - "engine/src/v03/**"
      - ".github/workflows/crop-evidence-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-and-native-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/crop-knowledge/v2/requirements.txt
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: python -m pip install -r data/crop-knowledge/v2/requirements.txt
      - run: python -m ruff check data/crop-knowledge/v2/tools data/crop-knowledge/v2/tests
      - run: python -m ruff format --check data/crop-knowledge/v2/tools data/crop-knowledge/v2/tests
      - run: python data/crop-knowledge/v2/tools/build.py --check
      - run: python data/crop-knowledge/v2/tools/knowledge.py check
      - run: python -m unittest discover -s data/crop-knowledge/v2/tests -p test_offline.py -v
      - run: python -m unittest discover -s data/crop-knowledge/v2/tests -p test_scientific.py -v
      - run: cargo build --locked --manifest-path engine/Cargo.toml --example v03_demo
      - run: cargo test --offline --locked --manifest-path engine/Cargo.toml
      - run: python -m unittest discover -s data/crop-knowledge/v2/tests -p test_rust_contract.py -v
      - run: git diff --check
      # Live tests are explicitly separate and never counted as passed by this job.
