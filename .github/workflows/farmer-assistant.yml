name: Farmer assistant contract and UI

on:
  pull_request:
    paths:
      - 'app/lib/evidence/features/assistant/**'
      - 'app/lib/evidence/assistant_demo.dart'
      - 'app/test/evidence/assistant/**'
      - 'server/earthsync/assistant/**'
      - 'server/tests/assistant/**'
      - 'docs/assistant/**'
      - '.github/workflows/farmer-assistant.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assistant-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements.lock
      - run: python -m pip install --no-deps -e server
      - run: python -m pytest -q server/tests/assistant
      - run: python -m ruff check server/earthsync/assistant server/tests/assistant
      - run: python -m ruff format --check server/earthsync/assistant server/tests/assistant

  assistant-flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - name: Check assistant formatting
        run: dart format --output=none --set-exit-if-changed app/lib/evidence/features/assistant app/lib/evidence/assistant_demo.dart app/test/evidence/assistant
      - name: Analyze assistant
        run: flutter analyze --no-fatal-infos lib/evidence/features/assistant lib/evidence/assistant_demo.dart test/evidence/assistant
        working-directory: app
      - run: flutter test test/evidence/assistant --reporter expanded
        working-directory: app
      - run: flutter build web --target lib/evidence/assistant_demo.dart --no-wasm-dry-run
        working-directory: app
