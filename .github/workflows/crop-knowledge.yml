name: Crop knowledge evidence

on:
  pull_request:
    paths: ["data/crop-knowledge/**", ".github/workflows/crop-knowledge.yml"]
  push:
    branches: [data/global-crop-knowledge]
    paths: ["data/crop-knowledge/**", ".github/workflows/crop-knowledge.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/crop-knowledge/v1/requirements.txt
      - run: python -m pip install -r data/crop-knowledge/v1/requirements.txt
      - run: python -m ruff check data/crop-knowledge/v1/tools data/crop-knowledge/v1/tests
      - run: python -m ruff format --check data/crop-knowledge/v1/tools data/crop-knowledge/v1/tests
      - run: python data/crop-knowledge/v1/tools/catalog.py check
      - run: python -m unittest discover -s data/crop-knowledge/v1/tests -v
      - run: git diff --check
